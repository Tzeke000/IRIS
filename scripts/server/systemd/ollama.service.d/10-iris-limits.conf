# /etc/systemd/system/ollama.service.d/10-iris-limits.conf - SYSTEM unit drop-in (2026-10-29 code review MED:
# Ollama kept models resident for 30 min next to Fish + two whispers on the one V100, with no admission check).
# One model at a time, unloaded after 5 idle minutes. NOT installed automatically (needs root + an ollama
# restart, which drops whatever is loaded) - install when convenient:
#   sudo install -m 0644 scripts/server/systemd/ollama.service.d/10-iris-limits.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# The existing models-on-data.conf drop-in (OLLAMA_MODELS) is untouched; drop-ins merge.
[Service]
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=5m"
