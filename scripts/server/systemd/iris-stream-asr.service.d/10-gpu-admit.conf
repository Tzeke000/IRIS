# 11-03 load-time GPU admission (doc audit "GPU checks"): the streaming-ASR sidecar (~3 GB) is OPTIONAL — the ears
# fall back to whisper without it — so it must never squeeze the mouth/ears. Wait up to 120 s for 3000 MiB +
# 1 GiB reserve; refuse the start otherwise (Restart=always retries later). Decisions: state/health/gpu_admission.jsonl
# install: cp to ~/.config/systemd/user/iris-stream-asr.service.d/ && systemctl --user daemon-reload (lands next start)
[Service]
ExecStartPre=/usr/bin/python3 %h/IRIS/scripts/server/gpu_admit.py 3000 --who stream_asr --wait 120
TimeoutStartSec=180
RestartSec=60
