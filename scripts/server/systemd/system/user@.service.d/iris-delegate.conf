# /etc/systemd/system/user@.service.d/iris-delegate.conf  (SYSTEM drop-in - needs sudo; repo copy only)
# 2026-10-30, V3 P2-R4b. Ubuntu 22.04's user@.service delegates only "memory pids" to the per-user
# systemd, so every CPUWeight= / CPUQuota= / IOWeight= on a USER unit or slice (iris-workers.slice,
# worker.py's per-job CPUQuota) is silently ignored - the slice cgroup has no cpu.* files at all.
# Delegating cpu + io lets those settings bite. Kernel has CONFIG_RT_GROUP_SCHED unset, so realtime
# audio threads don't block enabling the cpu controller.
# Takes effect for user@<uid> the next time it starts (reboot, or a planned full stack stop); check with
#   cat /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/cgroup.controllers
# which must list "cpu" (and io) afterwards.
[Service]
Delegate=cpu cpuset io memory pids
